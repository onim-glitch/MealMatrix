# Codemagic — ANDROID APK ONLY (direct install / sideload).
#
# IMPORTANT:
# - This workflow runs ONLY `flutter build apk --release` (never `flutter build appbundle`).
# - In Codemagic: Applications → Your app → start a build using the YAML workflow named below
#   ("Flutter APK only"). Delete/disable any DUPLICATE workflow in the Workflow Editor UI that
#   still runs `flutter build appbundle` unless you intentionally want Play Store bundles.
# - Google Play Publishing in Codemagic normally expects .aab files; omit that integration here
#   if you want APK downloads from Codemagic artifacts only.
#
# Artifact you should download after a green build:
# - build/app/outputs/flutter-apk/app-release.apk  (sometimes split ABIs produce multiple APKs).

workflows:
  android-apk:
    name: Flutter APK only
    max_build_duration: 120
    instance_type: linux_x2

    environment:
      flutter: stable

    triggering:
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Strip App Bundle outputs (avoid collecting .aab from cache)
        script: |
          rm -rf build/app/outputs/bundle 2>/dev/null || true

      - name: Build release APK (not AAB)
        script: |
          set -e
          chmod +x android/gradlew

          flutter build apk --release

          echo "--- APK artifacts (Flutter) ---"
          ls -lah build/app/outputs/flutter-apk/ || true

          apk_cnt=$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' 2>/dev/null | wc -l)
          apk_cnt=$((apk_cnt + 0))
          if [ "$apk_cnt" -lt 1 ]; then
            echo "FAILED: Expected at least one .apk under build/app/outputs/flutter-apk/"
            exit 1
          fi

          echo "OK: $apk_cnt APK file(s) ready for Codemagic artifact collection."

    artifacts:
      - build/app/outputs/flutter-apk/**/*.apk
